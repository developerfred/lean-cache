[package]
name = "lean-cache"
version = "0.1.0"
edition = "2021"
description = "Content-addressable build cache accelerator for Lean 4"
authors = ["builder-the-best"]
license = "MIT"

[[bin]]
name = "lean-cache"
path = "src/main.rs"

[profile.release]
opt-level = 3

[dependencies]
# Compressão de artefatos para reduzir disco e banda de rede.
zstd = "0.14"
lz4_flex = "0.11"

# Serialização JSON para comunicação com workers remotos.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Assinatura AWS v4 para cache remoto S3.
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
url = "2"

# Timestamps para snapshots de estado de elaboração.
chrono = { version = "0.4", features = ["serde"] }
