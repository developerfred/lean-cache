name: Lean Cache Benchmark

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lean 4 via elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Compile lean-cache (offline, std-only)
        run: |
          cd lean-cache
          cargo build --release
          cargo test
          cp target/release/lean-cache /usr/local/bin/

      - name: Check Lean version
        run: |
          lean --version
          lake --version

      - name: Cold build (empty cache)
        id: cold-build
        run: |
          rm -rf .lean-cache .lake build lake-manifest.json
          find . -name "*.olean" -delete 2>/dev/null || true
          find . -name "*.ilean" -delete 2>/dev/null || true
          find . -name "*.c" -delete 2>/dev/null || true
          echo "COLD_START=$(date +%s)" >> $GITHUB_ENV
          lean-cache build Main.lean || lake build
          echo "COLD_END=$(date +%s)" >> $GITHUB_ENV

      - name: Hot build (cache hit)
        id: hot-build
        run: |
          echo "HOT_START=$(date +%s)" >> $GITHUB_ENV
          lean-cache build Main.lean
          echo "HOT_END=$(date +%s)" >> $GITHUB_ENV

      - name: Calculate speedup
        run: |
          COLD=$(( ${COLD_END} - ${COLD_START} ))
          HOT=$(( ${HOT_END} - ${HOT_START} ))
          echo "Cold build: ${COLD}s"
          echo "Hot build: ${HOT}s"
          if [ "$HOT" -gt 0 ]; then
            SPEEDUP=$(echo "scale=2; $COLD / $HOT" | bc)
            echo "Speedup: ${SPEEDUP}x"
          else
            echo "Speedup: N/A (hot build was instant)"
            SPEEDUP="N/A"
          fi
          echo "speedup=${SPEEDUP}" >> $GITHUB_OUTPUT
        id: speedup

      - name: Upload cache as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: lean-cache-store
          path: .lean-cache/
          retention-days: 7

  # Second job simulates another machine/CI downloading the shared cache
  warm-cache-ci:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lean 4 via elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Compile lean-cache
        run: |
          cd lean-cache
          cargo build --release
          cargo test
          cp target/release/lean-cache /usr/local/bin/

      - name: Download shared cache
        uses: actions/download-artifact@v4
        with:
          name: lean-cache-store
          path: .lean-cache/

      - name: Build with shared cache (remote hit)
        run: |
          lean-cache build Main.lean
