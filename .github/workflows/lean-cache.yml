name: Lean Cache Benchmark

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Lean 4 via elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Instalar Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Compilar lean-cache (offline, std-only)
        run: |
          cd lean-cache
          cargo build --release
          cp target/release/lean-cache /usr/local/bin/

      - name: Verificar versão do Lean
        run: |
          lean --version
          lake --version

      - name: Build frio (cache vazio)
        id: cold-build
        run: |
          rm -rf .lean-cache .lake build lake-manifest.json
          find . -name "*.olean" -delete 2>/dev/null || true
          find . -name "*.ilean" -delete 2>/dev/null || true
          find . -name "*.c" -delete 2>/dev/null || true
          echo "COLD_START=$(date +%s)" >> $GITHUB_ENV
          lean-cache build Main.lean || lake build
          echo "COLD_END=$(date +%s)" >> $GITHUB_ENV

      - name: Build quente (cache hit)
        id: hot-build
        run: |
          echo "HOT_START=$(date +%s)" >> $GITHUB_ENV
          lean-cache build Main.lean
          echo "HOT_END=$(date +%s)" >> $GITHUB_ENV

      - name: Calcular speedup
        run: |
          COLD=$(( ${COLD_END} - ${COLD_START} ))
          HOT=$(( ${HOT_END} - ${HOT_START} ))
          echo "Build frio: ${COLD}s"
          echo "Build quente: ${HOT}s"
          if [ "$HOT" -gt 0 ]; then
            SPEEDUP=$(echo "scale=2; $COLD / $HOT" | bc)
            echo "Speedup: ${SPEEDUP}x"
          else
            echo "Speedup: N/A (build quente foi instantâneo)"
            SPEEDUP="N/A"
          fi
          echo "speedup=${SPEEDUP}" >> $GITHUB_OUTPUT
        id: speedup

      - name: Enviar cache como artefato do GitHub
        uses: actions/upload-artifact@v4
        with:
          name: lean-cache-store
          path: .lean-cache/
          retention-days: 7

  # Segundo job simula outra máquina/CI baixando o cache compartilhado
  warm-cache-ci:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Lean 4 via elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Instalar Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Compilar lean-cache
        run: |
          cd lean-cache
          cargo build --release
          cp target/release/lean-cache /usr/local/bin/

      - name: Baixar cache compartilhado
        uses: actions/download-artifact@v4
        with:
          name: lean-cache-store
          path: .lean-cache/

      - name: Build com cache compartilhado (hit remoto)
        run: |
          lean-cache build Main.lean
